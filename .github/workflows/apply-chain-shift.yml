name: Apply chain pharmacy shift update

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/apply-chain-shift.yml
      - scripts/apply-chain-shift.cjs

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply source patch
        run: node scripts/apply-chain-shift.cjs

      - name: Restore Vite entry and build
        run: |
          cat > index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
              <meta name="description" content="RxReady, a pharmacy arcade simulator for data entry, verification, manager shifts, and career consequences." />
              <title>RxReady Pharmacy Arcade</title>
            </head>
            <body>
              <div id="root"></div>
              <script type="module" src="/src/main.jsx"></script>
            </body>
          </html>
          HTML
          npm ci
          npm run build
          mkdir -p assets
          find assets -maxdepth 1 -type f -name 'index-*' -delete
          cp -r dist/assets/* assets/
          cp dist/index.html index.html

      - name: Remove one-time patch files
        run: |
          rm -f scripts/apply-chain-shift.cjs
          rm -f .github/workflows/apply-chain-shift.yml

      - name: Commit rebuilt game
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Gamify retail chain pharmacy shift" || echo "No changes to commit"
          git push
