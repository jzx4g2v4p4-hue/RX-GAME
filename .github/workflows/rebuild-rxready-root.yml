name: Rebuild RxReady root from source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-rxready-root.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Restore Vite entry HTML
        run: |
          cat > index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
              <meta name="description" content="RxReady, a pharmacy arcade simulator for data entry, verification, manager shifts, and career consequences." />
              <title>RxReady Pharmacy Arcade</title>
            </head>
            <body>
              <div id="root"></div>
              <script type="module" src="/src/main.jsx"></script>
            </body>
          </html>
          HTML
      - name: Build from React source
        run: |
          npm ci
          npm run build
      - name: Publish built app to repository root
        run: |
          mkdir -p assets
          rm -f assets/index-*.js
          cp -r dist/assets/. assets/
          cp dist/index.html index.html
          rm -f .github/workflows/rebuild-rxready-root.yml
      - name: Commit rebuilt root app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets .github/workflows/rebuild-rxready-root.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Rebuild RxReady root from source"
            git push
          fi
