name: Consolidate RxReady mode menu

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/consolidate-modes-root.yml'
      - 'scripts/consolidate-modes.cjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply mode consolidation
        run: node scripts/consolidate-modes.cjs
      - name: Build app
        run: |
          npm ci
          npm run build
      - name: Publish built app to repository root
        run: |
          mkdir -p assets
          rm -f assets/index-*.js
          cp -r dist/assets/. assets/
          cp dist/index.html index.html
          rm -f scripts/consolidate-modes.cjs
          rm -f .github/workflows/consolidate-modes-root.yml
      - name: Commit consolidation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/RxReady.jsx index.html assets scripts/consolidate-modes.cjs .github/workflows/consolidate-modes-root.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Consolidate RxReady mode menu"
            git push
          fi
