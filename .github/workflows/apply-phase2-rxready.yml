name: Apply Phase 2 RxReady Patch

on:
  push:
    paths:
      - scripts/apply-phase2-rxready.cjs
      - .github/workflows/apply-phase2-rxready.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Phase 2 patch
        run: node scripts/apply-phase2-rxready.cjs
      - name: Commit patched source and remove helper
        run: |
          rm -f scripts/apply-phase2-rxready.cjs .github/workflows/apply-phase2-rxready.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/RxReady.jsx scripts/apply-phase2-rxready.cjs .github/workflows/apply-phase2-rxready.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add manager queue control systems"
            git push
          fi
