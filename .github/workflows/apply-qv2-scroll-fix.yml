name: Apply QV2 scroll fix

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/apply-qv2-scroll-fix.yml
      - scripts/apply-qv2-scroll-fix.cjs

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  patch-build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply QV2 source patch
        run: node scripts/apply-qv2-scroll-fix.cjs

      - name: Restore Vite source entry
        run: |
          cat > index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
              <meta name="description" content="RxReady, a pharmacy arcade simulator for data entry, verification, manager shifts, and career consequences." />
              <title>RxReady Pharmacy Arcade</title>
            </head>
            <body>
              <div id="root"></div>
              <script type="module" src="/src/main.jsx"></script>
            </body>
          </html>
          HTML

      - name: Build production app
        run: |
          npm ci
          npm run build

      - name: Deploy patched build to gh-pages
        run: |
          cd dist
          touch .nojekyll
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy QV2 scroll fix from ${GITHUB_SHA::8}"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push origin gh-pages --force

      - name: Remove one-time patch files
        run: |
          cd "$GITHUB_WORKSPACE"
          rm -f scripts/apply-qv2-scroll-fix.cjs
          rm -f .github/workflows/apply-qv2-scroll-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply QV2 scroll fix" || echo "No source cleanup changes"
          git push
