name: Publish built RxReady root

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-built-root.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Copy built app to repository root
        run: |
          rm -rf assets
          cp -R dist/assets assets
          cp dist/index.html index.html
          rm -f .github/workflows/publish-built-root.yml
      - name: Commit built root app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html assets .github/workflows/publish-built-root.yml
          git commit -m "Serve built RxReady app from root"
          git push
