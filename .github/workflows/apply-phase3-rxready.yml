name: Apply RxReady phase 3

on:
  push:
    branches:
      - main
    paths:
      - scripts/apply-phase3-rxready.cjs
      - .github/workflows/apply-phase3-rxready.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply RxReady phase 3 patch
        run: node scripts/apply-phase3-rxready.cjs
      - name: Commit source update and remove helper files
        run: |
          rm -f scripts/apply-phase3-rxready.cjs
          rm -f .github/workflows/apply-phase3-rxready.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/RxReady.jsx scripts/apply-phase3-rxready.cjs .github/workflows/apply-phase3-rxready.yml
          git commit -m "Add manager escalations and CII audit"
          git push
