<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="A POV pharmacy simulator for data entry and prescription verification.">
<title>Pharmacy Workstation Simulator</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101114;color:#f5f1e7;font-family:Inter,Segoe UI,Arial,sans-serif}button,input,textarea,select{font:inherit}.app{display:grid;grid-template-columns:minmax(0,1fr)420px;width:100vw;height:100vh;min-height:680px}.scene{position:relative;overflow:hidden;background:linear-gradient(#374148 0 46%,#1b1e23 46% 100%)}.signs{position:absolute;left:0;right:0;top:0;height:54px;display:flex;align-items:center;justify-content:space-around;background:#161a1f;border-bottom:1px solid rgba(255,255,255,.12);font-size:12px;font-weight:900;color:#c7d5d6;text-transform:uppercase}.window{position:absolute;left:7%;right:7%;top:82px;height:235px;border:12px solid #242a30;background:linear-gradient(135deg,rgba(139,205,217,.35),rgba(37,45,54,.75));box-shadow:0 18px 38px rgba(0,0,0,.25)}.person{position:absolute;left:50%;top:45px;width:120px;height:150px;transform:translateX(-50%);border-radius:70px 70px 30px 30px;background:rgba(8,10,13,.38)}.glass{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);padding:9px 14px;border-radius:6px;background:rgba(9,11,14,.62);color:#d9f5f5;font-weight:900}.desk{position:absolute;left:0;right:0;bottom:0;height:62%;perspective:900px}.desk:before{content:"";position:absolute;left:-6%;right:-6%;bottom:0;height:58%;background:linear-gradient(#4a4942,#252722);clip-path:polygon(9% 0,91% 0,100% 100%,0 100%)}.paper{position:absolute;left:5%;bottom:14%;width:min(330px,30vw);min-height:360px;padding:18px;border-radius:5px;background:#f7efd9;color:#24312b;box-shadow:0 18px 34px rgba(0,0,0,.35);transform:rotate(-3deg)}.paper-head{display:flex;justify-content:space-between;border-bottom:2px solid #d8cba9;padding-bottom:8px;margin-bottom:12px}.paper dl{display:grid;gap:9px;margin:0}.paper dt{font-size:11px;font-weight:900;text-transform:uppercase;color:#6d765f}.paper dd{margin:1px 0 0;font-weight:800}.paper p{margin:12px 0 0;color:#5f6b5e;line-height:1.35}.monitor{position:absolute;left:36%;right:5%;bottom:22%;height:56%;border:14px solid #11161a;border-radius:12px;background:#0c1518;box-shadow:0 22px 40px rgba(0,0,0,.45);overflow:hidden}.monitor:after{content:"";position:absolute;left:40%;right:40%;bottom:-58px;height:58px;background:#11161a}.monitor-bar{height:38px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:#17252a;border-bottom:1px solid rgba(255,255,255,.12);font-size:12px;font-weight:900;text-transform:uppercase;color:#9be1df}.keyboard{position:absolute;left:39%;right:11%;bottom:7%;display:grid;grid-template-columns:repeat(6,1fr)2fr;gap:7px;padding:13px;border-radius:12px;background:#171a1e;box-shadow:0 16px 28px rgba(0,0,0,.36)}.keyboard span{height:24px;border-radius:4px;background:#2b3036}.keyboard .space{background:#3a4148}.panel{display:grid;grid-template-rows:auto auto 1fr auto;gap:12px;padding:14px;border-left:1px solid #343b43;background:#191c21;overflow:auto}.card{border:1px solid #343b43;border-radius:8px;background:#20252a;padding:14px}.eyebrow,.stats span{display:block;color:#b7b6ad;font-size:11px;font-weight:900;text-transform:uppercase}.card h1,.card h2{margin:4px 0 12px;line-height:1.05}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stats div{padding:9px;border-radius:6px;background:rgba(255,255,255,.05)}.stats strong{font-size:20px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tabs button,.primary,.secondary,.wide{min-height:44px;border:1px solid #343b43;border-radius:6px;background:#252b31;color:#f5f1e7;font-weight:900;cursor:pointer}.tabs .active,.primary{background:#5fc1d6;color:#071013}.secondary{background:#314044}.wide{width:100%;margin-top:8px}.task p,.message p{color:#b7b6ad;line-height:1.42}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.sig-help{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.sig-help div{display:flex;justify-content:space-between;gap:8px;padding:7px;border-radius:6px;background:rgba(255,255,255,.05);font-size:13px}.entry-grid{height:calc(100% - 38px);padding:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;overflow:auto}.field{display:grid;gap:5px}.field span{font-size:11px;font-weight:900;color:#9be1df;text-transform:uppercase}.field input,.field textarea,.field select{width:100%;min-height:36px;border:1px solid #314b52;border-radius:5px;background:#102125;color:#f5f1e7;padding:8px}.field textarea{min-height:82px;resize:vertical}.field.wrong input,.field.wrong textarea,.field.wrong select{border-color:#ee746c;background:#321d1f}.profile{display:flex;gap:14px;padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.12);color:#d9f5f5}.profile span{color:#b7b6ad}.compare{display:grid;grid-template-columns:130px 1fr 1fr;gap:1px;padding:14px}.compare>*{min-height:38px;padding:9px;background:#102125}.compare button{border:0;text-align:left;color:#f5f1e7;background:#25333a!important}.compare button.picked{background:#3a3020!important;color:#f0c76a}.bad-cell{background:#3a2224!important;color:#ffb5ae}.good-cell{background:#1d3228!important}.result{margin-top:12px;padding:11px;border-radius:7px;display:grid;gap:4px}.result.good{border:1px solid #6fd18b;background:#1c3528}.result.bad{border:1px solid #ee746c;background:#3b2322}@media(max-width:980px){.app{grid-template-columns:1fr;height:auto}.scene{min-height:680px}.panel{border-left:0;border-top:1px solid #343b43}.paper{width:36vw}.monitor{left:34%}}@media(max-width:680px){.scene{min-height:760px}.paper{left:5%;right:5%;width:auto;bottom:43%}.monitor{left:5%;right:5%;bottom:12%;height:38%}.keyboard{left:10%;right:10%;bottom:3%}.entry-grid{grid-template-columns:1fr}.compare{grid-template-columns:100px 1fr 1fr}.stats{grid-template-columns:1fr}.sig-help{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="app">
<section class="scene">
<div class="signs"><span>Drop-Off</span><span>Data Entry</span><span>Verify</span></div>
<div class="window"><div class="person"></div><div class="glass">Patient waiting at drop-off</div></div>
<div class="desk">
<section class="paper" id="paper"></section>
<section class="monitor"><div class="monitor-bar"><span>RxSystem Workstation</span><span id="screenLabel">New Rx Entry</span></div><div id="screen"></div></section>
<div class="keyboard"><span></span><span></span><span></span><span></span><span></span><span></span><span class="space"></span></div>
</div>
</section>
<aside class="panel">
<header class="card"><span class="eyebrow">Station</span><h1>Pharmacy Simulator</h1><div class="stats"><div><span>Mode</span><strong id="modeStat">Entry</strong></div><div><span>Score</span><strong id="score">0</strong></div><div><span>Accuracy</span><strong id="accuracy">100%</strong></div></div></header>
<div class="tabs"><button id="entryTab" class="active">Data Entry</button><button id="verifyTab">Verification</button></div>
<section class="card task" id="task"></section>
<section class="card message"><span class="eyebrow">Feedback</span><p id="message">Drop-off station is open. Choose Data Entry or Verification.</p></section>
</aside>
</main>
<script>
const entryCases=[{id:"rx-101",patient:"Maria Lopez",dob:"03/14/1979",prescriber:"Dr. Patel",drug:"Lisinopril",strength:"10 mg",form:"tablet",sigCode:"1 tab PO QD",sig:"Take 1 tablet by mouth daily",qty:"30",days:"30",refills:"2",daw:"No",notes:"New blood pressure medication. No ACE inhibitor allergy on profile."},{id:"rx-102",patient:"Andre Miller",dob:"11/02/1966",prescriber:"Dr. Nguyen",drug:"Metformin",strength:"500 mg",form:"tablet",sigCode:"1 tab PO BID with meals",sig:"Take 1 tablet by mouth twice daily with meals",qty:"60",days:"30",refills:"5",daw:"No",notes:"Profile shows type 2 diabetes. No renal warning on file."},{id:"rx-103",patient:"Tanya Reed",dob:"08/23/1992",prescriber:"Dr. Castillo",drug:"Sertraline",strength:"50 mg",form:"tablet",sigCode:"1 tab PO QAM",sig:"Take 1 tablet by mouth every morning",qty:"30",days:"30",refills:"1",daw:"No",notes:"Counseling flag: takes several weeks for full effect."},{id:"rx-104",patient:"Elaine Brooks",dob:"05/19/1958",prescriber:"Dr. Shah",drug:"Atorvastatin",strength:"20 mg",form:"tablet",sigCode:"1 tab PO QHS",sig:"Take 1 tablet by mouth at bedtime",qty:"90",days:"90",refills:"3",daw:"No",notes:"Insurance prefers 90 day maintenance prescriptions."}];
const verifyCases=[{id:"ver-201",patient:"Caleb Morgan",dob:"11/10/1962",prescriber:"Dr. Vega",original:{drug:"Amlodipine",strength:"5 mg",sig:"Take 1 tablet by mouth daily",qty:"30",days:"30",refills:"4",daw:"No"},entered:{drug:"Amlodipine",strength:"10 mg",sig:"Take 1 tablet by mouth daily",qty:"30",days:"30",refills:"4",daw:"No"},wrong:["strength"],teaching:"Strength mismatch: the hard copy says 5 mg but the entry says 10 mg."},{id:"ver-202",patient:"Priya Nair",dob:"02/25/1988",prescriber:"Dr. Moore",original:{drug:"Sertraline",strength:"50 mg",sig:"Take 1 tablet by mouth every morning",qty:"30",days:"30",refills:"1",daw:"No"},entered:{drug:"Sertraline",strength:"50 mg",sig:"Take 1 tablet by mouth at bedtime",qty:"30",days:"30",refills:"1",daw:"No"},wrong:["sig"],teaching:"Directions mismatch: QAM was entered as bedtime."},{id:"ver-203",patient:"Jordan Lee",dob:"09/03/1974",prescriber:"Dr. Kim",original:{drug:"Lisinopril",strength:"10 mg",sig:"Take 1 tablet by mouth daily",qty:"30",days:"30",refills:"2",daw:"No"},entered:{drug:"Lisinopril",strength:"10 mg",sig:"Take 1 tablet by mouth daily",qty:"90",days:"90",refills:"2",daw:"No"},wrong:["qty","days"],teaching:"Quantity and days supply were changed from 30 to 90."},{id:"ver-204",patient:"Maya Bennett",dob:"04/12/1981",prescriber:"Dr. Shah",original:{drug:"Atorvastatin",strength:"20 mg",sig:"Take 1 tablet by mouth at bedtime",qty:"90",days:"90",refills:"3",daw:"No"},entered:{drug:"Atorvastatin",strength:"20 mg",sig:"Take 1 tablet by mouth at bedtime",qty:"90",days:"90",refills:"3",daw:"No"},wrong:[],teaching:"Clean entry. All fields match the hard copy."}];
const labels={patient:"Patient",dob:"DOB",prescriber:"Prescriber",drug:"Drug",strength:"Strength",sig:"Directions",qty:"Quantity",days:"Days Supply",refills:"Refills",daw:"DAW"};
const sigHelp=[["PO","by mouth"],["QD","daily"],["BID","twice daily"],["TID","three times daily"],["QAM","every morning"],["QHS","at bedtime"],["PRN","as needed"]];
const fields=["patient","dob","prescriber","drug","strength","sig","qty","days","refills","daw"], verifyFields=["drug","strength","sig","qty","days","refills","daw"];
let mode="entry",ei=0,vi=0,score=0,checked=0,entry={},picked=[],entryResult=null,verifyResult=null,message="Drop-off station is open. Choose Data Entry or Verification.";
const $=id=>document.getElementById(id), norm=v=>String(v||"").toLowerCase().replace(/\s+/g," ").replace(/[.,]/g,"").trim(), same=(a,b)=>norm(a)===norm(b);
function currentEntry(){return entryCases[ei%entryCases.length]}function currentVerify(){return verifyCases[vi%verifyCases.length]}function emptyEntry(){entry={patient:"",dob:"",prescriber:"",drug:"",strength:"",sig:"",qty:"",days:"",refills:"",daw:"No"}}
function paper(){const rx=mode==="entry"?currentEntry():currentVerify(), o=mode==="entry"?rx:rx.original;$("paper").innerHTML=`<div class="paper-head"><strong>Hard Copy Rx</strong><span>${rx.id}</span></div><dl><div><dt>Patient</dt><dd>${rx.patient}</dd></div><div><dt>DOB</dt><dd>${rx.dob}</dd></div><div><dt>Prescriber</dt><dd>${rx.prescriber}</dd></div><div><dt>Medication</dt><dd>${o.drug} ${o.strength}</dd></div><div><dt>Sig</dt><dd>${mode==="entry"?rx.sigCode:o.sig}</dd></div><div><dt>Qty / Days</dt><dd>${o.qty} / ${o.days}</dd></div><div><dt>Refills / DAW</dt><dd>${o.refills} / ${o.daw}</dd></div></dl>${mode==="entry"?`<p>${rx.notes}</p>`:""}`}
function entryScreen(){let html='<div class="entry-grid">';fields.forEach(f=>{const wrong=entryResult&&entryResult.includes(f);html+=`<label class="field ${wrong?"wrong":""}"><span>${labels[f]}</span>`;if(f==="sig")html+=`<textarea data-field="${f}">${entry[f]||""}</textarea>`;else if(f==="daw")html+=`<select data-field="${f}"><option ${entry[f]==="No"?"selected":""}>No</option><option ${entry[f]==="Yes"?"selected":""}>Yes</option></select>`;else html+=`<input data-field="${f}" value="${entry[f]||""}">`;html+="</label>"});$("screen").innerHTML=html+"</div>";document.querySelectorAll("[data-field]").forEach(el=>el.oninput=el.onchange=()=>{entry[el.dataset.field]=el.value;entryResult=null})}
function verifyScreen(){const rx=currentVerify();let html=`<div class="profile"><strong>${rx.patient}</strong><span>DOB ${rx.dob}</span><span>${rx.prescriber}</span></div><div class="compare"><span></span><strong>Original</strong><strong>Entered</strong>`;verifyFields.forEach(f=>{const isPicked=picked.includes(f), should=rx.wrong.includes(f), judged=verifyResult&&(isPicked||should);html+=`<button data-pick="${f}" class="${isPicked?"picked":""}">${labels[f]}</button><div>${rx.original[f]}</div><div class="${judged?(should?"bad-cell":"good-cell"):""}">${rx.entered[f]}</div>`});$("screen").innerHTML=html+"</div>";document.querySelectorAll("[data-pick]").forEach(btn=>btn.onclick=()=>{const f=btn.dataset.pick;picked=picked.includes(f)?picked.filter(x=>x!==f):[...picked,f];verifyResult=null;render()})}
function task(){if(mode==="entry"){$("task").innerHTML=`<span class="eyebrow">Entry Task</span><h2>Key the hard copy</h2><p>Enter patient, prescriber, drug, directions, quantity, days supply, refills, and DAW exactly as the prescription requires.</p><div class="sig-help">${sigHelp.map(s=>`<div><strong>${s[0]}</strong><span>${s[1]}</span></div>`).join("")}</div>${entryResult?resultEntry():""}<div class="buttons"><button class="secondary" id="practice">Practice Fill</button><button class="primary" id="checkEntry">Submit Entry</button></div><button class="wide" id="nextEntry">Next Script</button>`;$("practice").onclick=practice;$("checkEntry").onclick=checkEntry;$("nextEntry").onclick=()=>{ei++;emptyEntry();entryResult=null;message="New hard copy at drop-off. Key it into the system.";render()}}else{const rx=currentVerify();$("task").innerHTML=`<span class="eyebrow">Verification Task</span><h2>Compare and decide</h2><p>Click any entered fields that do not match the original. If the entry is clean, approve it.</p>${verifyResult?`<div class="result ${verifyResult.exact?"good":"bad"}"><strong>${verifyResult.exact?"Correct verification":"Needs review"}</strong><span>${rx.teaching}</span></div>`:""}<div class="buttons"><button class="secondary" id="sendBack">Send Back</button><button class="primary" id="approve">Approve Clean</button></div><button class="wide" id="nextVerify">Next Verification</button>`;$("sendBack").onclick=()=>checkVerify(false);$("approve").onclick=()=>checkVerify(true);$("nextVerify").onclick=()=>{vi++;picked=[];verifyResult=null;message="Next verification screen is ready. Compare each field.";render()}}}
function resultEntry(){return entryResult.length?`<div class="result bad"><strong>Corrections needed</strong><span>${entryResult.map(f=>labels[f]).join(", ")}</span></div>`:`<div class="result good"><strong>Clean</strong><span>Entry matched the hard copy.</span></div>`}
function practice(){const rx=currentEntry();entry={patient:rx.patient,dob:rx.dob,prescriber:rx.prescriber,drug:rx.drug,strength:rx.strength,sig:rx.sig,qty:rx.qty,days:rx.days,refills:rx.refills,daw:rx.daw};entryResult=null;message="Fields loaded for practice. Review them like you keyed them.";render()}
function checkEntry(){const rx=currentEntry(), expected={patient:rx.patient,dob:rx.dob,prescriber:rx.prescriber,drug:rx.drug,strength:rx.strength,sig:rx.sig,qty:rx.qty,days:rx.days,refills:rx.refills,daw:rx.daw};entryResult=Object.keys(expected).filter(f=>!same(expected[f],entry[f]));score+=Math.max(0,100-entryResult.length*12);checked++;message=entryResult.length?`Entry needs correction in ${entryResult.length} field(s).`:"Clean data entry. Ready for pharmacist verification.";render()}
function checkVerify(approve){const rx=currentVerify(), exp=[...rx.wrong].sort(), sel=approve?[]:[...picked].sort(), exact=exp.length===sel.length&&exp.every((f,i)=>f===sel[i]);verifyResult={exact};score+=exact?100:Math.max(0,60-Math.abs(exp.length-sel.length)*20);checked++;message=exact?"Verification call was correct.":"Review the hard copy again. A mismatch was missed or overcalled.";render()}
function render(){paper();$("screenLabel").textContent=mode==="entry"?"New Rx Entry":"Pharmacist Verification";$("modeStat").textContent=mode==="entry"?"Entry":"Verify";$("score").textContent=score;$("accuracy").textContent=checked?Math.round(score/(checked*100)*100)+"%":"100%";$("message").textContent=message;$("entryTab").className=mode==="entry"?"active":"";$("verifyTab").className=mode==="verify"?"active":"";mode==="entry"?entryScreen():verifyScreen();task()}
$("entryTab").onclick=()=>{mode="entry";entryResult=null;verifyResult=null;picked=[];message="Data entry station active. Key the hard copy exactly.";render()};$("verifyTab").onclick=()=>{mode="verify";entryResult=null;verifyResult=null;picked=[];message="Verification station active. Mark mismatches before approval.";render()};emptyEntry();render();
</script>
</body>
</html>
